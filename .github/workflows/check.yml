# Generated by tools/build_public.py from tools/public-check.yml in the private cv project: edit it there.
# Runs tests/check_site.py on every push to any branch. main is protected and requires this job,
# so a commit reaches main (and GitHub Pages) only after it passed here on another branch.
# Actions are pinned to commit SHAs (tags can be moved).
name: check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv run --with playwright==1.65.2 python -m playwright install --with-deps chromium webkit firefox
      - run: uv run --with playwright==1.65.2 --with pypdf python tests/check_site.py
